name: "Gemini Code Review"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: "Run Gemini Code Review"
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        with:
          # Optional: Model selection (defaults to Gemini 2.5/Flash/Pro)
          model: "gemini-3.8-flash"
          # Optional: Exclude lockfiles, assets, and build artifacts
          exclude: "*.md,*.json,package-lock.json,poetry.lock,*.yaml,*.yml,dist/*,build/*"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
